<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Love • 杨淇超我爱你</title>

	<!-- 字体镜像（避免 Google Fonts 被墙） -->
	<link rel="preconnect" href="https://fonts.font.im">
	<link href="https://fonts.font.im/css2?family=Noto+Serif+SC:wght@400;600;900&family=Montserrat:wght@300;600;800&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

	<!-- 样式文件 -->
	<link rel="stylesheet" href="./styles.css">
</head>
<body>
	<div class="bg-layer">
		<div class="blob b1"></div>
		<div class="blob b2"></div>
		<div class="blob b3"></div>
		<div class="grid"></div>
	</div>

	<main class="stage">
		<section class="card glass">
			<div class="heart3d" aria-hidden="true">
				<svg viewBox="0 0 100 90" class="heart-svg">
					<defs>
						<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
							<stop offset="0%" stop-color="#ff7aa2"/>
							<stop offset="50%" stop-color="#ff3b7b"/>
							<stop offset="100%" stop-color="#ffb86c"/>
						</linearGradient>
					</defs>
					<path d="M50 80 C20 60, 5 45, 10 30 C14 18, 26 12, 36 16 C42 18, 47 24, 50 30 C53 24, 58 18, 64 16 C74 12, 86 18, 90 30 C95 45, 80 60, 50 80 Z" fill="url(#g)"/>
				</svg>
			</div>

			<h1 class="headline">
				<span class="spark">✦</span>
				<span id="typeTarget" class="type"></span>
				<span class="cursor">|</span>
			</h1>
			<p class="sub">愿把星河揉碎，化作人间烟火，只为与你相伴。</p>

			<div class="actions">
				<button id="burstBtn" class="btn">撒一把爱心</button>
				<button id="toggleTheme" class="btn ghost">切换主题</button>
				<button id="setStartBtn" class="btn ghost">设置纪念日</button>
			</div>

			<div class="counter glass" aria-live="polite">
				<div class="counter-title">我们已经在一起</div>
				<div class="counter-row">
					<div class="block"><span id="cDays" class="num">0</span><span class="unit">天</span></div>
					<div class="block"><span id="cHours" class="num">00</span><span class="unit">时</span></div>
					<div class="block"><span id="cMinutes" class="num">00</span><span class="unit">分</span></div>
					<div class="block"><span id="cSeconds" class="num">00</span><span class="unit">秒</span></div>
				</div>
				<div class="counter-sub">从 <span id="startDateText">—</span> 到现在</div>
				<input id="startDateInput" type="date" style="display:none">
			</div>
		</section>

		<canvas id="loveCanvas"></canvas>
	</main>

	<!-- 延迟加载脚本，避免 DOM 未加载 -->
	<script src="./script.js" defer></script>
</body>
</html>
